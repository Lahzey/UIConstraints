<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1">
  <!--
    UI Constraints icon: Render Manager
    Shows: two arrows going around in a circle: the UI is rendered again and again
    Used by: Unity RenderManager (renders all constraints, created automatically), Godot the equivalent autoload

    Conventions (shared by all icons, see ../README.md):
    - 16x16 grid, the size of component icons in Unity and Godot. 1px strokes are on half pixel coordinates (e.g. x="1.5"), so they cover whole pixels and stay sharp.
    - The color says the category. This is Logic: variables, repetition and visibility:
      fill #3FB8AF, outline #1D6F69.
    - The amber badge in the bottom right marks it as a UI Constraints component.
  -->

  <!-- the upper arrow: an arc from the left over the top to the upper right -->
  <path d="M2.5 8a5.5 5.5 0 0 1 9.5-3.8" stroke="#3FB8AF" stroke-width="2" stroke-linecap="round"/>
  <!-- its arrow head -->
  <path d="M12.5 1.5v3h-3" stroke="#3FB8AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the lower arrow: an arc from the right under the bottom to the lower left (partly behind the badge) -->
  <path d="M13.5 8A5.5 5.5 0 0 1 4 11.8" stroke="#3FB8AF" stroke-width="2" stroke-linecap="round"/>
  <!-- its arrow head -->
  <path d="M3.5 14.5v-3h3" stroke="#3FB8AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Badge (bottom right, drawn last so it is on top): an amber tile with '=' on it, meaning "set by expressions".
       Every UI Constraints component has it, which tells them apart from the built-in component they control (e.g. Image Constraint vs. Image). -->
  <rect x="9.5" y="9.5" width="6" height="6" rx="1.5" fill="#F2B134" stroke="#8A5A00"/>
  <!-- the two bars of the '=' -->
  <path d="M11 11.5h3M11 13.5h3" stroke="#4A3000" stroke-linecap="round"/>
</svg>
